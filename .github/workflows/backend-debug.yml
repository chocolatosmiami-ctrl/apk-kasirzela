name: Build new backend debug APK
on:
  push:
    branches: [build/self-hosted-debug]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin ff37bef603469fb030f2b72995ab929ccfc227f0
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile
      - name: Build debug APK
        run: flutter build apk --debug --build-name=1.0.3 --build-number=4 --dart-define-from-file=config/backend-public.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kasir-zela-new-backend-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
