name: pos_kasir
description: Aplikasi Point of Sale untuk Rumah Makan - Offline Android

publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database lokal
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.5

  # State management
  provider: ^6.1.2

  # Supabase - database & auth
  supabase_flutter: ^2.8.4
  connectivity_plus: ^6.0.3
  http: ^1.2.0
  url_launcher: ^6.3.0

  # Bluetooth Thermal Printer
  print_bluetooth_thermal: ^1.1.9

  # UI & Utilitas
  image_picker: ^1.1.2
  permission_handler: ^12.0.0+1
  share_plus: ^10.0.0
  pdf: ^3.10.8
  printing: ^5.12.0
  intl: ^0.19.0
  crypto: ^3.0.6
  image: ^4.1.7
  esc_pos_utils_plus: ^2.0.4
  uuid: ^4.5.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/