# Naikkan memory - Kotlin 2.1.0 butuh Metaspace lebih besar
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=0 -XX:+HeapDumpOnOutOfMemoryError

# Matikan daemon agar tidak ada crash dari daemon lama
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configureondemand=false

# Android
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
